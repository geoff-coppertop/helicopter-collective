name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  devcontainer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: CONTAINER_USER=vscode
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tmag5273
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is picked up automatically; rustup installs the
      # pinned nightly on first run.
      - name: Run TMAG5273 driver tests
        run: cargo test
