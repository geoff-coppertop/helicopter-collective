# .cargo/config.toml

[build]
target = "thumbv8m.main-none-eabihf"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip=RP235x"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tdefmt.x",
]

[alias]
# Run host-side unit tests (lib only; embedded target has no std)
test-host = "test --lib --target x86_64-unknown-linux-gnu"

[env]
DEFMT_LOG = "debug"
